name: Translate release changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to translate, for example v4.6.2"
        required: true
        type: string
      force:
        description: "Re-translate even if changelog blocks already exist"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache changelog translations
        uses: actions/cache@v5
        with:
          path: translation_cache
          key: deepl-release-${{ github.event.release.tag_name || inputs.release_tag }}-${{ github.run_id }}
          restore-keys: |
            deepl-release-${{ github.event.release.tag_name || inputs.release_tag }}-

      - name: Translate and update release body
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          FORCE_TRANSLATE: ${{ inputs.force || 'false' }}
        run: python tools/translate_github_release_deepl.py
